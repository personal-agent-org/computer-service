name: Release
on:
  workflow_dispatch:
    inputs:
      micro:
        description: "MICRO version within this month — leave empty to continue from the tags"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: ci
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: pacs-linux-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: pacs-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: pacs-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p computer-service
      - name: Stage binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/pacs"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Continue from the newest existing tag for this month, like the other repos here. It
        # used to take MICRO from a required input defaulting to "0", so a release triggered
        # without picking a number reused one -- or, with the input left empty, built a tag
        # ending in a bare dot.
        run: |
          prefix="$(date -u +%Y).$(date -u +%-m)"
          micro="${{ github.event.inputs.micro }}"
          if [ -z "$micro" ]; then
            git fetch --tags --force --quiet || true
            last=-1
            for t in $(git tag -l "v${prefix}.*"); do
              n="${t##v${prefix}.}"
              case "$n" in ''|*[!0-9]*) continue ;; esac
              [ "$n" -gt "$last" ] && last="$n"
            done
            micro=$(( last + 1 ))
          fi
          v="v${prefix}.${micro}"
          git rev-parse "$v" >/dev/null 2>&1 || { git tag "$v" && git push origin "$v"; }
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "$v" --generate-notes
          gh release upload "$v" --clobber bins/pacs-*

  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/personal-agent-org/personal-agent-sandbox:latest
