name: Release
on:
  workflow_dispatch:
    inputs:
      minor:
        description: "MINOR version within this month — leave empty to continue from the tags"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute CalVer
        id: version
        run: |
          prefix="$(date -u +%Y).$(date -u +%-m)"
          minor="${{ github.event.inputs.minor }}"
          if [ -z "$minor" ]; then
            git fetch --tags --force --quiet || true
            last=-1
            for tag in $(git tag -l "${prefix}.*"); do
              candidate="${tag##${prefix}.}"
              case "$candidate" in ''|*[!0-9]*) continue ;; esac
              [ "$candidate" -gt "$last" ] && last="$candidate"
            done
            minor=$((last + 1))
          fi
          case "$minor" in ''|*[!0-9]*) echo "MINOR must be numeric" >&2; exit 1 ;; esac
          echo "value=${prefix}.${minor}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: pacs-linux-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: pacs-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: pacs-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build versioned binary
        env:
          PACS_BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: cargo build --release --target ${{ matrix.target }} -p computer-service
      - name: Stage binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/pacs"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          v="$VERSION"
          git rev-parse "$v" >/dev/null 2>&1 || { git tag "$v" && git push origin "$v"; }
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "$v" --generate-notes
          gh release upload "$v" --clobber bins/pacs-*

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PACS_BUILD_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/personal-agent-org/computer-service:${{ needs.release.outputs.version }}
            ghcr.io/personal-agent-org/computer-service:latest
